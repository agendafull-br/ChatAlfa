<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AgendaFull - Chat de Atendimento</title>
    
    <style>
        :root {
            --roxo-escuro: #4A0E78;
            --roxo-medio: #6B21A8;
            --roxo-claro: #8B5CF6;
            --roxo-bg: #F5F0FF;
            --branco: #FFFFFF;
            --cinza-claro: #F3F4F6;
            --cinza-medio: #9CA3AF;
            --texto-escuro: #1F2937;
            --sombra: 0 10px 40px rgba(107, 33, 168, 0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .welcome-screen {
            background: var(--branco);
            border-radius: 30px;
            padding: 50px 30px;
            text-align: center;
            max-width: 450px;
            width: 100%;
            box-shadow: var(--sombra);
            position: relative;
            overflow: hidden;
        }

        .welcome-screen::before {
            content: '';
            position: absolute;
            top: -50px;
            right: -50px;
            width: 150px;
            height: 150px;
            background: var(--roxo-claro);
            border-radius: 50%;
            opacity: 0.1;
        }

        .logo { font-size: 42px; font-weight: 800; color: var(--roxo-medio); margin-bottom: 10px; position: relative; z-index: 1; }
        .logo span { color: var(--roxo-claro); }
        .subtitle { color: var(--cinza-medio); margin-bottom: 40px; font-size: 14px; position: relative; z-index: 1; }

        .contact-btn {
            padding: 20px;
            border: none;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-decoration: none;
            color: white;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, var(--roxo-medio) 0%, var(--roxo-claro) 100%);
            width: 100%;
        }
        .contact-btn:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .contact-btn:active { transform: translateY(-1px); }

        .chat-container {
            background: var(--branco);
            border-radius: 20px;
            width: 100%;
            max-width: 420px;
            height: 650px;
            display: none;
            flex-direction: column;
            box-shadow: var(--sombra);
            overflow: hidden;
        }
        .chat-container.active { display: flex; }

        .chat-header {
            background: linear-gradient(135deg, var(--roxo-medio), var(--roxo-claro));
            color: white;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .back-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s;
        }
        .back-btn:hover { background: rgba(255,255,255,0.3); }

        .chat-avatar {
            width: 45px;
            height: 45px;
            background: rgba(255,255,255,0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .chat-header-info h3 { font-size: 16px; font-weight: 600; }
        .chat-header-info p { font-size: 12px; opacity: 0.9; }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #F9FAFB;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message { display: flex; flex-direction: column; max-width: 80%; animation: fadeInUp 0.3s ease; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.support { align-self: flex-start; }
        .message.user { align-self: flex-end; }

        .message-bubble {
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.4;
            position: relative;
            word-wrap: break-word;
        }

        .message.support .message-bubble {
            background: white;
            color: var(--texto-escuro);
            border: 1px solid #E5E7EB;
            border-bottom-left-radius: 4px;
        }

        .message.user .message-bubble {
            background: linear-gradient(135deg, var(--roxo-medio), var(--roxo-claro));
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message-time { font-size: 11px; color: var(--cinza-medio); margin-top: 4px; padding: 0 8px; }

        .typing-indicator {
            align-self: flex-start;
            background: white;
            border: 1px solid #E5E7EB;
            padding: 12px 16px;
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            display: none;
        }
        .typing-indicator.active { display: block; }

        .typing-dots { display: flex; gap: 4px; }
        .typing-dots span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--cinza-medio);
            animation: typing 1.4s infinite;
        }
        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-10px); }
        }

        .chat-input-area { padding: 15px; background: white; border-top: 1px solid #E5E7EB; display: flex; gap: 10px; }
        .chat-input-area input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #E5E7EB;
            border-radius: 25px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }
        .chat-input-area input:focus { border-color: var(--roxo-claro); }

        .send-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--roxo-medio), var(--roxo-claro));
            color: white;
            border: none;
            cursor: pointer;
            font-size: 18px;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .send-btn:hover { transform: scale(1.05); box-shadow: 0 4px 15px rgba(107, 33, 168, 0.3); }
        .send-btn:active { transform: scale(0.95); }

        .system-message { text-align: center; font-size: 12px; color: var(--cinza-medio); padding: 10px; }

        @media (max-width: 480px) {
            .welcome-screen { padding: 30px 20px; }
            .logo { font-size: 32px; }
            .contact-btn { font-size: 16px; padding: 16px; }
        }
    </style>
</head>

    <div id="welcomeScreen" class="welcome-screen">

        </div>
        <div class="chat-input-area">

        function openChat() {
            document.getElementById('welcomeScreen').style.display = 'none';
            document.getElementById('chatContainer').classList.add('active');
            setTimeout(() => { enviarMensagemBot(CONFIG.mensagemBoasVindas); }, 500);
        }

        function goBack() {
            document.getElementById('chatContainer').classList.remove('active');
            document.getElementById('welcomeScreen').style.display = 'block';
            document.getElementById('chatMessages').innerHTML = '<div class="system-message">💜 Conversa iniciada</div>';
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const mensagem = input.value.trim();
            if (!mensagem) return;
            mostrarMensagem(mensagem, 'user', 'Você');
            input.value = '';
            setTimeout(() => {
                const resposta = buscarResposta(mensagem);
                mostrarDigitacao();
                setTimeout(() => { esconderDigitacao(); enviarMensagemBot(resposta); }, CONFIG.tempoDigitacao * 1000);
            }, 500);
        }

        function buscarResposta(mensagem) {
            const textoMinusculo = mensagem.toLowerCase();
            for (const config of RESPOSTAS_AUTOMATICAS) {
                const encontrou = config.palavrasChave.some(palavra => textoMinusculo.includes(palavra.toLowerCase()));
                if (encontrou) return config.resposta;
            }
            return CONFIG.mensagemSemResposta;
        }

        function enviarMensagemBot(texto) { mostrarMensagem(texto, 'support', 'AgendaFull'); }

        function mostrarMensagem(texto, remetente, nome) {
            const container = document.getElementById('chatMessages');
            if (!container) return;
            const div = document.createElement('div');
            div.className = 'message ' + (remetente === 'user' ? 'user' : 'support');
            const hora = new Date().toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
            div.innerHTML = `<div class="message-bubble">${texto.replace(/\n/g, '<br>')}</div><div class="message-time">${nome} • ${hora}</div>`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function mostrarDigitacao() { document.getElementById('typingIndicator')?.classList.add('active'); }
        function esconderDigitacao() { document.getElementById('typingIndicator')?.classList.remove('active'); }

        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && document.activeElement === document.getElementById('messageInput')) sendMessage();
        });
