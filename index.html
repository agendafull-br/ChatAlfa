<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AgendaFull - Chat de Atendimento</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <style>
        :root {
            --roxo-escuro: #4A0E78;
            --roxo-medio: #6B21A8;
            --roxo-claro: #8B5CF6;
            --roxo-bg: #F5F0FF;
            --branco: #FFFFFF;
            --cinza-claro: #F3F4F6;
            --cinza-medio: #9CA3AF;
            --texto-escuro: #1F2937;
            --sombra: 0 10px 40px rgba(107, 33, 168, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .welcome-screen {
            background: var(--branco);
            border-radius: 30px;
            padding: 50px 30px;
            text-align: center;
            max-width: 450px;
            width: 100%;
            box-shadow: var(--sombra);
            position: relative;
            overflow: hidden;
        }

        .welcome-screen::before {
            content: '';
            position: absolute;
            top: -50px;
            right: -50px;
            width: 150px;
            height: 150px;
            background: var(--roxo-claro);
            border-radius: 50%;
            opacity: 0.1;
        }

        .logo {
            font-size: 42px;
            font-weight: 800;
            color: var(--roxo-medio);
            margin-bottom: 10px;
            position: relative;
            z-index: 1;
        }

        .logo span {
            color: var(--roxo-claro);
        }

        .subtitle {
            color: var(--cinza-medio);
            margin-bottom: 40px;
            font-size: 14px;
            position: relative;
            z-index: 1;
        }

        .contact-options {
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: relative;
            z-index: 1;
        }

        .contact-btn {
            padding: 20px;
            border: none;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-decoration: none;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .contact-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .contact-btn:active {
            transform: translateY(-1px);
        }

        .whatsapp-btn {
            background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
        }

        .chat-btn {
            background: linear-gradient(135deg, var(--roxo-medio) 0%, var(--roxo-claro) 100%);
        }

        .contact-btn i {
            font-size: 28px;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--cinza-medio);
            font-size: 13px;
            position: relative;
            z-index: 1;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #E5E7EB;
        }

        .chat-container {
            background: var(--branco);
            border-radius: 20px;
            width: 100%;
            max-width: 420px;
            height: 650px;
            display: none;
            flex-direction: column;
            box-shadow: var(--sombra);
            overflow: hidden;
        }

        .chat-container.active {
            display: flex;
        }

        .chat-header {
            background: linear-gradient(135deg, var(--roxo-medio), var(--roxo-claro));
            color: white;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .back-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s;
        }

        .back-btn:hover {
            background: rgba(255,255,255,0.3);
        }

        .chat-avatar {
            width: 45px;
            height: 45px;
            background: rgba(255,255,255,0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .chat-header-info h3 {
            font-size: 16px;
            font-weight: 600;
        }

        .chat-header-info p {
            font-size: 12px;
            opacity: 0.9;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #F9FAFB;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            display: flex;
            flex-direction: column;
            max-width: 80%;
            animation: fadeInUp 0.3s ease;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.support {
            align-self: flex-start;
        }

        .message.user {
            align-self: flex-end;
        }

        .message-bubble {
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.4;
            position: relative;
            word-wrap: break-word;
        }

        .message.support .message-bubble {
            background: white;
            color: var(--texto-escuro);
            border: 1px solid #E5E7EB;
            border-bottom-left-radius: 4px;
        }

        .message.user .message-bubble {
            background: linear-gradient(135deg, var(--roxo-medio), var(--roxo-claro));
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message-time {
            font-size: 11px;
            color: var(--cinza-medio);
            margin-top: 4px;
            padding: 0 8px;
        }

        .typing-indicator {
            align-self: flex-start;
            background: white;
            border: 1px solid #E5E7EB;
            padding: 12px 16px;
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            display: none;
        }

        .typing-indicator.active {
            display: block;
        }

        .typing-dots {
            display: flex;
            gap: 4px;
        }

        .typing-dots span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--cinza-medio);
            animation: typing 1.4s infinite;
        }

        .typing-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-10px); }
        }

        .chat-input-area {
            padding: 15px;
            background: white;
            border-top: 1px solid #E5E7EB;
            display: flex;
            gap: 10px;
        }

        .chat-input-area input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #E5E7EB;
            border-radius: 25px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        .chat-input-area input:focus {
            border-color: var(--roxo-claro);
        }

        .send-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--roxo-medio), var(--roxo-claro));
            color: white;
            border: none;
            cursor: pointer;
            font-size: 18px;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(107, 33, 168, 0.3);
        }

        .send-btn:active {
            transform: scale(0.95);
        }

        .system-message {
            text-align: center;
            font-size: 12px;
            color: var(--cinza-medio);
            padding: 10px;
        }

        .admin-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--roxo-escuro);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: all 0.3s;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .admin-btn:hover {
            background: var(--roxo-medio);
            transform: translateY(-2px);
        }

        /* ============ ADMIN - SIMPLES E LIMPO ============ */
        .admin-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 10px;
        }

        .admin-overlay.active {
            display: flex;
        }

        .admin-box {
            background: white;
            border-radius: 20px;
            width: 100%;
            max-width: 450px;
            height: 90vh;
            max-height: 700px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        /* Tela de senha */
        .admin-login-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 30px;
            height: 100%;
            text-align: center;
        }

        .admin-login-screen h2 {
            font-size: 22px;
            color: var(--texto-escuro);
            margin-bottom: 30px;
        }

        .admin-login-screen input {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #E5E7EB;
            border-radius: 12px;
            font-size: 16px;
            text-align: center;
            margin-bottom: 20px;
            outline: none;
        }

        .admin-login-screen input:focus {
            border-color: var(--roxo-claro);
        }

        .admin-login-screen button {
            width: 100%;
            padding: 15px;
            background: var(--roxo-medio);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .admin-login-error {
            color: #EF4444;
            font-size: 13px;
            margin-top: 10px;
            display: none;
        }

        /* Cabeçalho admin */
        .admin-top-bar {
            background: var(--roxo-escuro);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .admin-top-bar h2 {
            font-size: 17px;
            font-weight: 600;
        }

        .admin-close-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Lista de conversas */
        .admin-conversations {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            background: #F9FAFB;
        }

        .admin-conv-card {
            background: white;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 10px;
            cursor: pointer;
            border: 2px solid transparent;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
        }

        .admin-conv-card:active,
        .admin-conv-card.active {
            border-color: var(--roxo-medio);
            background: var(--roxo-bg);
        }

        .admin-conv-info {
            flex: 1;
            min-width: 0;
        }

        .admin-conv-info strong {
            display: block;
            font-size: 14px;
            color: var(--texto-escuro);
            margin-bottom: 3px;
        }

        .admin-conv-info span {
            font-size: 12px;
            color: var(--cinza-medio);
            display: block;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .admin-conv-badge {
            background: var(--roxo-medio);
            color: white;
            padding: 4px 10px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
            margin-left: 10px;
            white-space: nowrap;
        }

        .admin-conv-delete {
            background: #EF4444;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 11px;
            cursor: pointer;
            margin-left: 8px;
            white-space: nowrap;
        }

        /* Chat do admin (dentro do modal) */
        .admin-chat-view {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #F9FAFB;
        }

        .admin-chat-view .chat-messages {
            flex: 1;
        }

        .admin-chat-view .chat-input-area {
            flex-shrink: 0;
        }

        /* Aba de respostas automáticas */
        .admin-auto-tab {
            padding: 15px;
            background: white;
            border-top: 1px solid #E5E7EB;
            flex-shrink: 0;
            max-height: 45%;
            overflow-y: auto;
        }

        .admin-auto-tab h3 {
            font-size: 15px;
            margin-bottom: 12px;
            color: var(--texto-escuro);
        }

        .auto-item {
            background: #F9FAFB;
            padding: 10px 12px;
            border-radius: 10px;
            margin-bottom: 8px;
            position: relative;
        }

        .auto-item input {
            width: 100%;
            padding: 10px;
            border: 1px solid #E5E7EB;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 5px;
            outline: none;
        }

        .auto-item input:focus {
            border-color: var(--roxo-claro);
        }

        .auto-item .remove-auto {
            position: absolute;
            top: 8px;
            right: 8px;
            background: #EF4444;
            color: white;
            border: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            font-size: 12px;
            cursor: pointer;
        }

        .admin-btn-secondary {
            width: 100%;
            padding: 12px;
            border: 2px dashed var(--roxo-claro);
            background: var(--roxo-bg);
            color: var(--roxo-medio);
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 8px;
        }

        .admin-btn-primary {
            width: 100%;
            padding: 12px;
            background: var(--roxo-medio);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
        }

        .admin-empty {
            text-align: center;
            color: var(--cinza-medio);
            padding: 30px;
            font-size: 14px;
        }

        @media (max-width: 480px) {
            .welcome-screen {
                padding: 30px 20px;
            }
            .logo {
                font-size: 32px;
            }
            .contact-btn {
                font-size: 16px;
                padding: 16px;
            }
            .admin-box {
                height: 100vh;
                max-height: 100vh;
                border-radius: 0;
            }
        }
    </style>
</head>
<body>

    <!-- TELA DE ESCOLHA -->
    <div id="welcomeScreen" class="welcome-screen">
        <div class="logo">Agenda<span>Full</span></div>
        <p class="subtitle">Escolha como prefere falar conosco</p>
        <div class="contact-options">
            <a href="https://wa.me/5511919698999" target="_blank" class="contact-btn whatsapp-btn">
                💬 WhatsApp
            </a>
            <div class="divider">ou</div>
            <button onclick="openChat()" class="contact-btn chat-btn">
                💜 ChatAlfa
            </button>
        </div>
    </div>

    <!-- CHAT DO CLIENTE -->
    <div id="chatContainer" class="chat-container">
        <div class="chat-header">
            <button class="back-btn" onclick="goBack()">←</button>
            <div class="chat-avatar">💜</div>
            <div class="chat-header-info">
                <h3>AgendaFull</h3>
                <p>Online • Responde em até 5 min</p>
            </div>
        </div>
        <div id="chatMessages" class="chat-messages">
            <div class="system-message">💜 Conversa iniciada</div>
        </div>
        <div id="typingIndicator" class="typing-indicator">
            <div class="typing-dots">
                <span></span><span></span><span></span>
            </div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="messageInput" placeholder="Digite sua mensagem..." onkeypress="if(event.key==='Enter')sendMessage()">
            <button class="send-btn" onclick="sendMessage()">➤</button>
        </div>
    </div>

    <!-- BOTÃO ADMIN -->
    <button class="admin-btn" onclick="openAdmin()">
        ⚙️ Admin
    </button>

    <!-- ADMIN MODAL -->
    <div id="adminOverlay" class="admin-overlay">
        <div class="admin-box" id="adminBox">
            <!-- Conteúdo dinâmico -->
        </div>
    </div>

    <script>
        // ==================== CONFIGURAÇÃO ====================
        const firebaseConfig = {
            apiKey: "AIzaSyDPj6duxzX2JJAxEMe9zbHevp8ZvncN1MQ",
            authDomain: "chatalfa-93c94.firebaseapp.com",
            projectId: "chatalfa-93c94",
            storageBucket: "chatalfa-93c94.firebasestorage.app",
            messagingSenderId: "485022411344",
            appId: "1:485022411344:web:3e5baf445cffc7a6e17f55"
        };

        const ADMIN_PASSWORD = 'admin123'; // ⚠️ ALTERE ESTA SENHA!

        // Inicializar Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // ==================== VARIÁVEIS GLOBAIS ====================
        let currentUserId = null;
        let currentConversationId = null;
        let isAdminLogged = false;
        let selectedAdminChat = null;
        let unsubscribeChat = null;
        let unsubscribeAdminList = null;
        let unsubscribeAdminMessages = null;
        
        let autoResponses = [
            { keywords: ['olá', 'oi', 'ola', 'oie', 'bom dia', 'boa tarde', 'boa noite'], response: 'Olá! 👋 Bem-vindo ao AgendaFull! Como posso ajudar você hoje?' },
            { keywords: ['preço', 'preco', 'valor', 'planos', 'quanto custa', 'valores'], response: '📊 Nossos planos:\n\n💈 Barbearia Basic: R$29,90/mês\n💈 Barbearia Premium: R$49,90/mês\n💇 Salão Basic: R$29,90/mês\n💇 Salão Premium: R$49,90/mês\n\n✨ 7 dias grátis sem cartão!' },
            { keywords: ['horário', 'horario', 'horas', 'funcionamento'], response: '🕐 Nosso suporte funciona:\n\nSeg-Sáb: 8h às 20h\nDomingo: 9h às 13h\n\nO sistema de agendamento funciona 24h!' },
            { keywords: ['whatsapp', 'zap', 'telefone', 'contato', 'número', 'numero'], response: '📱 Também atendemos pelo WhatsApp!\n\n👉 (11) 91969-8999\n\nFique à vontade para chamar!' },
            { keywords: ['teste', 'grátis', 'gratis', 'experimentar', 'demonstração'], response: '🎉 Temos 7 dias de teste GRÁTIS!\n\nSem precisar de cartão de crédito. Acesse nosso site e experimente!' },
            { keywords: ['site', 'sistema', 'agendamento', 'agenda'], response: '💻 Nosso sistema de agendamento inclui:\n\n✅ Agendamento online 24h\n✅ Gestão de clientes\n✅ Controle financeiro\n✅ Painel administrativo\n✅ Notificações automáticas' }
        ];

        // ==================== INICIALIZAÇÃO ====================
        function init() {
            const savedResponses = localStorage.getItem('agendafull_auto_responses');
            if (savedResponses) {
                try { autoResponses = JSON.parse(savedResponses); } catch (e) {}
            }
            
            const savedId = localStorage.getItem('agendafull_user_id');
            if (savedId) {
                currentUserId = savedId;
            } else {
                currentUserId = 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
                localStorage.setItem('agendafull_user_id', currentUserId);
            }
            
            console.log('💜 AgendaFull ChatAlfa iniciado!');
            console.log('🔑 Senha admin padrão:', ADMIN_PASSWORD);
        }

        // ==================== CHAT CLIENTE ====================
        function openChat() {
            document.getElementById('welcomeScreen').style.display = 'none';
            document.getElementById('chatContainer').classList.add('active');
            currentConversationId = currentUserId;
            
            db.collection('chats').doc(currentConversationId).get().then(doc => {
                if (!doc.exists) {
                    sendAutomatedMessage("Olá! 👋 Bem-vindo ao ChatAlfa da AgendaFull!\n\nComo posso ajudar você hoje?\n\n💡 Dica: Também atendemos pelo WhatsApp (11) 91969-8999");
                }
            }).catch(() => {});
            
            loadMessages();
        }

        function goBack() {
            if (unsubscribeChat) { unsubscribeChat(); unsubscribeChat = null; }
            document.getElementById('chatContainer').classList.remove('active');
            document.getElementById('welcomeScreen').style.display = 'block';
            document.getElementById('chatMessages').innerHTML = '<div class="system-message">💜 Conversa iniciada</div>';
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            if (!message || !currentConversationId) return;
            
            db.collection('chats').doc(currentConversationId).collection('messages').add({
                text: message,
                sender: 'user',
                timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                userId: currentUserId,
                userName: 'Cliente'
            }).then(() => {
                return db.collection('chats').doc(currentConversationId).set({
                    lastMessage: message,
                    lastUpdate: firebase.firestore.FieldValue.serverTimestamp(),
                    userName: 'Cliente',
                    unread: true
                }, { merge: true });
            }).catch(err => console.error('Erro:', err));
            
            input.value = '';
            setTimeout(() => checkAutoResponse(message), 1000);
        }

        function checkAutoResponse(userMessage) {
            const lowerMessage = userMessage.toLowerCase();
            for (const autoResp of autoResponses) {
                if (autoResp.keywords.some(k => lowerMessage.includes(k.toLowerCase()))) {
                    showTypingIndicator();
                    setTimeout(() => {
                        hideTypingIndicator();
                        sendAutomatedMessage(autoResp.response);
                    }, 2000 + Math.random() * 2000);
                    return;
                }
            }
        }

        function sendAutomatedMessage(text) {
            db.collection('chats').doc(currentConversationId).collection('messages').add({
                text: text,
                sender: 'support',
                timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                userId: 'admin',
                userName: 'AgendaFull'
            }).then(() => {
                return db.collection('chats').doc(currentConversationId).set({
                    lastMessage: text,
                    lastUpdate: firebase.firestore.FieldValue.serverTimestamp(),
                    unread: false
                }, { merge: true });
            }).catch(() => {});
        }

        function showTypingIndicator() {
            document.getElementById('typingIndicator')?.classList.add('active');
        }

        function hideTypingIndicator() {
            document.getElementById('typingIndicator')?.classList.remove('active');
        }

        function loadMessages() {
            if (unsubscribeChat) unsubscribeChat();
            
            unsubscribeChat = db.collection('chats').doc(currentConversationId)
                .collection('messages').orderBy('timestamp')
                .onSnapshot(snapshot => {
                    snapshot.docChanges().forEach(change => {
                        if (change.type === 'added') displayMessage(change.doc.data());
                    });
                });
        }

        function displayMessage(message) {
            const container = document.getElementById('chatMessages');
            if (!container) return;
            
            const div = document.createElement('div');
            div.className = 'message ' + (message.sender === 'user' ? 'user' : 'support');
            
            let time = '';
            if (message.timestamp) {
                try { time = new Date(message.timestamp.toDate()).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}); } catch(e) {}
            }
            
            div.innerHTML = `
                <div class="message-bubble">${escapeHtml(message.text).replace(/\n/g, '<br>')}</div>
                <div class="message-time">${message.sender === 'support' ? 'AgendaFull • ' : ''}${time}</div>
            `;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text || '';
            return div.innerHTML;
        }

        // ==================== ADMIN ====================
        function openAdmin() {
            document.getElementById('adminOverlay').classList.add('active');
            document.body.style.overflow = 'hidden';
            if (isAdminLogged) {
                renderAdminPanel();
            } else {
                renderAdminLogin();
            }
        }

        function closeAdmin() {
            document.getElementById('adminOverlay').classList.remove('active');
            document.body.style.overflow = '';
            if (unsubscribeAdminList) { unsubscribeAdminList(); unsubscribeAdminList = null; }
            if (unsubscribeAdminMessages) { unsubscribeAdminMessages(); unsubscribeAdminMessages = null; }
            selectedAdminChat = null;
        }

        function renderAdminLogin() {
            const box = document.getElementById('adminBox');
            box.innerHTML = `
                <div class="admin-login-screen">
                    <h2>🔐 Acesso Administrativo</h2>
                    <input type="password" id="adminPassInput" placeholder="Digite a senha admin">
                    <button onclick="doAdminLogin()">Entrar</button>
                    <div class="admin-login-error" id="adminLoginError">Senha incorreta</div>
                </div>
            `;
        }

        function doAdminLogin() {
            const pass = document.getElementById('adminPassInput').value;
            if (pass === ADMIN_PASSWORD) {
                isAdminLogged = true;
                renderAdminPanel();
            } else {
                document.getElementById('adminLoginError').style.display = 'block';
            }
        }

        function renderAdminPanel() {
            const box = document.getElementById('adminBox');
            box.innerHTML = `
                <div class="admin-top-bar">
                    <h2>💼 Painel Admin</h2>
                    <button class="admin-close-btn" onclick="closeAdmin()">✕</button>
                </div>
                <div class="admin-conversations" id="adminConversationsList">
                    <div class="admin-empty">Carregando conversas...</div>
                </div>
                <div class="admin-auto-tab" id="adminAutoTab">
                    <h3>🤖 Respostas Automáticas</h3>
                    <div id="autoResponsesContainer"></div>
                    <button class="admin-btn-secondary" onclick="addAutoResponse()">+ Nova Resposta</button>
                    <button class="admin-btn-primary" onclick="saveAutoResponses()">💾 Salvar</button>
                </div>
            `;
            
            loadAdminConversations();
            renderAutoResponses();
        }

        function loadAdminConversations() {
            const container = document.getElementById('adminConversationsList');
            if (!container) return;
            if (unsubscribeAdminList) unsubscribeAdminList();
            
            unsubscribeAdminList = db.collection('chats').orderBy('lastUpdate', 'desc').limit(50)
                .onSnapshot(snapshot => {
                    if (!document.getElementById('adminConversationsList')) return;
                    
                    if (snapshot.empty) {
                        container.innerHTML = '<div class="admin-empty">Nenhuma conversa ainda</div>';
                        return;
                    }
                    
                    let html = '';
                    snapshot.forEach(doc => {
                        const data = doc.data();
                        const isActive = selectedAdminChat === doc.id;
                        html += `
                            <div class="admin-conv-card ${isActive ? 'active' : ''}" onclick="openAdminChat('${doc.id}')">
                                <div class="admin-conv-info">
                                    <strong>${data.userName || 'Cliente'}</strong>
                                    <span>${(data.lastMessage || 'Nova conversa').substring(0, 45)}</span>
                                </div>
                                ${data.unread ? '<span class="admin-conv-badge">Nova</span>' : ''}
                                <button class="admin-conv-delete" onclick="event.stopPropagation();deleteConversation('${doc.id}')">🗑️</button>
                            </div>
                        `;
                    });
                    container.innerHTML = html;
                });
        }

        function openAdminChat(chatId) {
            selectedAdminChat = chatId;
            
            const box = document.getElementById('adminBox');
            box.innerHTML = `
                <div class="admin-top-bar">
                    <button class="admin-close-btn" onclick="backToAdminList()" style="background:rgba(255,255,255,0.2);border:none;color:white;padding:8px 15px;border-radius:20px;cursor:pointer;font-size:13px;">← Voltar</button>
                    <h2>Chat</h2>
                    <button class="admin-close-btn" onclick="closeAdmin()">✕</button>
                </div>
                <div class="admin-chat-view">
                    <div class="chat-messages" id="adminChatMessages">
                        <div class="admin-empty">Carregando mensagens...</div>
                    </div>
                    <div class="chat-input-area">
                        <input type="text" id="adminMessageInput" placeholder="Digite sua resposta..." onkeypress="if(event.key==='Enter')sendAdminMessage()">
                        <button class="send-btn" onclick="sendAdminMessage()">➤</button>
                    </div>
                </div>
            `;
            
            // Marcar como lida
            db.collection('chats').doc(chatId).update({ unread: false }).catch(() => {});
            
            // Carregar mensagens
            loadAdminMessages(chatId);
        }

        function backToAdminList() {
            selectedAdminChat = null;
            if (unsubscribeAdminMessages) {
                unsubscribeAdminMessages();
                unsubscribeAdminMessages = null;
            }
            renderAdminPanel();
        }

        function loadAdminMessages(chatId) {
            if (unsubscribeAdminMessages) unsubscribeAdminMessages();
            
            const container = document.getElementById('adminChatMessages');
            if (!container) return;
            
            unsubscribeAdminMessages = db.collection('chats').doc(chatId)
                .collection('messages').orderBy('timestamp')
                .onSnapshot(snapshot => {
                    if (!document.getElementById('adminChatMessages')) return;
                    
                    let html = '';
                    snapshot.forEach(doc => {
                        const msg = doc.data();
                        const senderClass = msg.sender === 'user' ? 'user' : 'support';
                        let time = '';
                        if (msg.timestamp) {
                            try { time = new Date(msg.timestamp.toDate()).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}); } catch(e) {}
                        }
                        html += `
                            <div class="message ${senderClass}">
                                <div class="message-bubble">${escapeHtml(msg.text).replace(/\n/g, '<br>')}</div>
                                <div class="message-time">${msg.userName || 'Sistema'} • ${time}</div>
                            </div>
                        `;
                    });
                    container.innerHTML = html || '<div class="admin-empty">Nenhuma mensagem</div>';
                    container.scrollTop = container.scrollHeight;
                });
        }

        function sendAdminMessage() {
            const input = document.getElementById('adminMessageInput');
            if (!input || !selectedAdminChat) return;
            const message = input.value.trim();
            if (!message) return;
            
            db.collection('chats').doc(selectedAdminChat).collection('messages').add({
                text: message,
                sender: 'support',
                timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                userId: 'admin',
                userName: 'AgendaFull'
            }).then(() => {
                return db.collection('chats').doc(selectedAdminChat).set({
                    lastMessage: message,
                    lastUpdate: firebase.firestore.FieldValue.serverTimestamp(),
                    unread: false
                }, { merge: true });
            }).catch(() => {});
            input.value = '';
        }

        function deleteConversation(chatId) {
            if (!confirm('Excluir esta conversa permanentemente?')) return;
            
            db.collection('chats').doc(chatId).collection('messages').get()
                .then(snapshot => {
                    const batch = db.batch();
                    snapshot.forEach(doc => batch.delete(doc.ref));
                    return batch.commit();
                })
                .then(() => db.collection('chats').doc(chatId).delete())
                .then(() => {
                    if (selectedAdminChat === chatId) backToAdminList();
                })
                .catch(() => alert('Erro ao excluir'));
        }

        // ==================== RESPOSTAS AUTOMÁTICAS ====================
        function renderAutoResponses() {
            const container = document.getElementById('autoResponsesContainer');
            if (!container) return;
            
            let html = '';
            autoResponses.forEach((resp, i) => {
                html += `
                    <div class="auto-item">
                        <input type="text" value="${escapeHtml(resp.keywords.join(', '))}" onchange="updateAutoKeyword(${i}, this.value)" placeholder="Palavras-chave (separadas por vírgula)">
                        <input type="text" value="${escapeHtml(resp.response)}" onchange="updateAutoText(${i}, this.value)" placeholder="Resposta automática">
                        <button class="remove-auto" onclick="deleteAutoResponse(${i})">✕</button>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function updateAutoKeyword(index, value) {
            autoResponses[index].keywords = value.split(',').map(k => k.trim().toLowerCase()).filter(k => k);
        }

        function updateAutoText(index, value) {
            autoResponses[index].response = value;
        }

        function addAutoResponse() {
            autoResponses.push({ keywords: ['palavra-chave'], response: 'Nova resposta automática' });
            renderAutoResponses();
        }

        function deleteAutoResponse(index) {
            if (confirm('Remover esta resposta?')) {
                autoResponses.splice(index, 1);
                renderAutoResponses();
            }
        }

        function saveAutoResponses() {
            localStorage.setItem('agendafull_auto_responses', JSON.stringify(autoResponses));
            alert('✅ Configurações salvas!');
        }

        // ==================== INICIAR ====================
        init();
    </script>
</body>
</html>
